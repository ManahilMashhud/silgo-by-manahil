apiVersion: apps/v1
kind: Deployment
metadata:
  name: silgo-consumer-deployment
  namespace: manahil-silgo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: silgo-consumer
  template:
    metadata:
      labels:
        app: silgo-consumer
    spec:
      containers:
      - name: silgo-consumer
        image: 192.168.5.232:8085/silgo/silgo-website:latest
        imagePullPolicy: Always
        command: ["node", "consumer.js"]
        env:
        - name: RABBITMQ_URL
          value: "amqp://user:310oHcR2mLsPLQSK@rabbitmq.rabbitmq.svc.cluster.local:5672"