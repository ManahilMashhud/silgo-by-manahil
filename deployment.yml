apiVersion: apps/v1
kind: Deployment
metadata:
  name: silgo-deployment
  namespace: manahil-silgo
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: silgo
  template:
    metadata:
      labels:
        app: silgo
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "silgo-role"
        vault.hashicorp.com/agent-inject-secret-rabbitmq: "secret%20/data/rabbitmq"
        vault.hashicorp.com/agent-inject-template-rabbitmq: |
          {{- with secret "secret%20/data/rabbitmq" -}}
          {{ .Data.data.rabbitmq_url }}
          {{- end -}}
    spec:
      containers:
      - name: silgo
        image: 192.168.5.234/silgo/silgo-website:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000