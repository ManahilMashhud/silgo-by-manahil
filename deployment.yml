apiVersion: apps/v1
kind: Deployment
metadata:
  name: silgo-deployment
  namespace: death
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: silgo
  template:
    metadata:
      labels:
        app: silgo
    spec:
      containers:
      - name: silgo
        image: 192.168.5.232:8085/silgo/silgo-website:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: RABBITMQ_URL
          value: "amqp://guest:guest@rabbitmq-svc.moon.svc.cluster.local:5672"