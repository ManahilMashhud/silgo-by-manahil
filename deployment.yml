apiVersion: apps/v1
kind: Deployment
metadata:
  name: silgo-deployment
  namespace: manahil-silgo
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: silgo
  template:
    metadata:
      labels:
        app: silgo
    spec:
      containers:
      - name: silgo
        image: 192.168.5.234/silgo/silgo-website:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: RABBITMQ_URL
          value: "amqp://user:310oHcR2mLsPLQSK@rabbitmq.rabbitmq.svc.cluster.local:5672"